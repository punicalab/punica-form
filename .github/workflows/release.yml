name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm build && pnpm typecheck && pnpm test

      # The token the publish step authenticates with. Version 2 of the
      # Changesets action no longer writes it
      - name: Authenticate with npm
        run: echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Opens the "Version Packages" pull request while changesets are pending,
      # publishes to npm once that pull request is merged
      - name: Version or Publish
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          # The commit hooks are for people; the action commits on its own
          HUSKY: 0
          # Read by the .npmrc that actions/setup-node writes
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # A signed statement of where and from which commit the packages were
          # built. The setting of the packages (publishConfig) is not read by
          # the publish command the workflow runs; this is.
          NPM_CONFIG_PROVENANCE: true
